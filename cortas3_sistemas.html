<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz IPO2</title>

<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background: #f4f4f4;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }

  h1 {
    text-align: center;
    margin: 20px 0 5px 0;
  }

  .subtitle {
    font-size: 16px;
    color: #555;
    margin-bottom: 15px;
    text-align: center;
  }

  .top-panel {
    width: 90%;
    max-width: 600px;
    background: #fff;
    padding: 15px;
    margin-bottom: 10px;
    border-radius: 8px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  }

  .top-panel p {
    margin: 5px 0;
    font-size: 16px;
  }

  .quiz-container {
    width: 90%;
    max-width: 600px;
    margin-bottom: 30px;
    padding-top: 10px;
  }

  .question {
    background: #fff;
    padding: 20px;
    margin: 10px 0;
    border-radius: 8px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  }

  .question p {
    font-size: 34px;
    font-weight: bold;
    line-height: 1.4;
    margin: 0 0 30px 0;
  }

  .options {
    margin-top: 20px;
  }

  .options button {
    display: block;
    margin: 10px 0;
    padding: 15px;
    width: 100%;
    border-radius: 5px;
    border: 1px solid #ccc;
    cursor: pointer;
    background: #eee;
    transition: background 0.3s;
    font-size: 22px;
    text-transform: uppercase;
  }

  .options button:hover {
    background: #ddd;
  }

  .options button:disabled {
    cursor: not-allowed;
  }

  .correct {
    background-color: #c8e6c9 !important;
    border-color: #388e3c !important;
    color: #2e7d32 !important;
  }

  .wrong {
    background-color: #ffcdd2 !important;
    border-color: #d32f2f !important;
    color: #c62828 !important;
  }

  .result {
    font-weight: bold;
    font-size: 1.3em;
    margin: 10px 0;
  }

  .buttons {
    display: flex;
    gap: 10px;
    margin-bottom: 40px;
    flex-wrap: wrap;
    justify-content: center;
  }

  button.main-btn {
    padding: 12px 25px;
    border: none;
    border-radius: 6px;
    background: #2196F3;
    color: white;
    font-size: 1.1em;
    cursor: pointer;
  }

  button.main-btn:hover {
    background: #1976D2;
  }

  button.reset-btn {
    padding: 12px 25px;
    border: none;
    border-radius: 6px;
    background: #e53935;
    color: white;
    font-size: 1.1em;
    cursor: pointer;
  }

  button.reset-btn:hover {
    background: #c62828;
  }

  .small-text {
    font-size: 15px !important;
    font-weight: normal !important;
    color: #555;
  }

  @media (max-width: 600px) {
    .question p {
      font-size: 28px;
    }

    .options button {
      font-size: 20px;
    }
  }
</style>
</head>

<body>

<h1>Quiz Gestion Administrativa</h1>
<div class="subtitle">Preguntas aleatorias sin repetir hasta completar todo el temario</div>

<div class="top-panel">
  <p id="totalQuestionsText">Preguntas totales: 0</p>
  <p id="pendingQuestionsText">Preguntas pendientes: 0</p>
  <p id="completedQuestionsText">Preguntas realizadas: 0</p>
</div>

<div class="quiz-container" id="quiz-container"></div>

<div class="result" id="result">Puntuación: 0</div>

<div class="buttons">
  <button id="nextBtn" class="main-btn" style="display:none;">Siguiente</button>
  <button id="resetBtn" class="reset-btn">Reiniciar progreso</button>
</div>

<script>
/* ============================
   FUNCIÓN PARA MEZCLAR ARRAYS
============================ */
function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}


/* ============================
   AÑADE AQUÍ TUS PREGUNTAS
   No tienes que indicar cuántas hay.
   El código las cuenta automáticamente.
============================ */
const allQuestions = [
  
     "question": "B.6 - Quin sistema orgànic correspon a una nefrolitotomia percutània?",
    "options": [],
    "answer": "Sistema urinario",
    "explanation": "El procedimiento actúa en el riñón."
  },
  {
    "question": "B.6 - Quin sistema orgànic correspon a una salpingectomia bilateral?",
    "options": [],
    "answer": "Sistema reproductor femenino",
    "explanation": "La intervención actúa sobre las trompas de Falopio."
  },
  {
    "question": "B.6 - D’entre les venes renal, jugular i subclàvia, quina queda fora de Venes Superiors?",
    "options": [],
    "answer": "Vena renal",
    "explanation": "La yugular y la subclavia se incluyen en Venas Superiores."
  },
  {
    "question": "B.7 - En una biòpsia percutània del lòbul superior del pulmó dret, quina localització anatòmica va a la quarta posició?",
    "options": [],
    "answer": "Lóbulo superior del pulmón derecho",
    "explanation": "La cuarta posición recoge la estructura concreta y su lateralidad cuando está disponible."
  },
  {
    "question": "B.7 - En una artrodesi L5-S1, quina localització anatòmica correspon a la quarta posició?",
    "options": [],
    "answer": "Articulación lumbosacra",
    "explanation": "L5 y S1 forman la unión entre la columna lumbar y el sacro."
  },
  {
    "question": "B.7 - En una artrodesi L4-L5, quina localització anatòmica correspon a la quarta posició?",
    "options": [],
    "answer": "Articulación vertebral lumbar",
    "explanation": "L4 y L5 son dos vértebras lumbares."
  },
  {
    "question": "B.7 - En una nefrectomia total dreta per lumbotomia oberta, indica el tipus de procediment i l’abordatge.",
    "options": [],
    "answer": "Resección y abordaje abierto",
    "explanation": "Total identifica la resección del riñón y la lumbotomía abierta identifica el acceso."
  },
  {
    "question": "B.7 - En una biòpsia percutània d’un tumor d’ovari dret, quin qualificador correspon a la setena posició?",
    "options": [],
    "answer": "Diagnóstico (X)",
    "explanation": "La muestra se toma para análisis."
  },
  {
    "question": "B.7 - En una angioplàstia amb un stent coronari no farmacològic, què representa el stent i en quina posició es registra?",
    "options": [],
    "answer": "Dispositivo intraluminal, 6.ª posición",
    "explanation": "El stent permanece dentro de la arteria tras la dilatación."
  },
  {
    "question": "B.7 - Què indica la cinquena posició en un codi de la secció mèdica i quirúrgica? I en la taula de suport urinari per hemodiàlisi?",
    "options": [],
    "answer": "Abordaje y duración, respectivamente",
    "explanation": "El significado de la quinta posición depende de la sección."
  },
  {
    "question": "B.7 - Quina condició han de complir els valors de les posicions quarta a setena quan construeixes un codi a partir d’una taula?",
    "options": [],
    "answer": "Deben pertenecer a la misma fila",
    "explanation": "Una fila delimita las combinaciones permitidas de esos caracteres."
  },
  {
    "question": "B.7 - Quin valor correspon a la sisena posició si, en una reparació quirúrgica, el material de tancament són sutures habituals i no hi ha cap altre dispositiu?",
    "options": [],
    "answer": "Z — Ninguno",
    "explanation": "Las suturas habituales forman parte del cierre."
  },
  {
    "question": "B.7 - Què distingeix la mesura de la pressió arterial del monitoratge de la pressió arterial?",
    "options": [],
    "answer": "La medición es puntual y la monitorización registra valores a lo largo de un periodo",
    "explanation": "La distinción depende de cómo se registra la función."
  },
  {
    "question": "B.7 - Quina informació donen, respectivament, la segona i la quarta posició a la secció mèdica i quirúrgica?",
    "options": [],
    "answer": "Sistema orgánico y localización anatómica",
    "explanation": "La segunda indica el grupo general y la cuarta identifica la estructura concreta."
  },
  {
    "question": "Teoria - Per què es diu que la CIM-10-SCP és exhaustiva?",
    "options": [],
    "answer": "Porque asigna un código único a cada procedimiento significativamente diferente",
    "explanation": "Es la definición utilizada en el cuestionario oficial del IOC."
  },
  {
    "question": "Teoria - Quina característica de la CIM-10-SCP permet incorporar codis per a tècniques noves?",
    "options": [],
    "answer": "Expansibilidad",
    "explanation": "La clasificación permite añadir valores y códigos para nuevas técnicas."
  },
  {
    "question": "Teoria - Què vol dir que la CIM-10-SCP té una estructura multiaxial?",
    "options": [],
    "answer": "Cada posición aporta un tipo concreto de información",
    "explanation": "En la sección médico-quirúrgica, la tercera identifica el tipo de procedimiento y la cuarta la localización."
  },
  {
    "question": "Teoria - Quants caràcters té un codi CIM-10-SCP i quines dues lletres s’exclouen?",
    "options": [],
    "answer": "Siete caracteres. Se excluyen I y O.",
    "explanation": "Así se evita confundir esas letras con el uno y el cero."
  },
  {
    "question": "Teoria - Quants abordatges diferents recull la secció mèdica i quirúrgica?",
    "options": [],
    "answer": "Siete",
    "explanation": "Son abierto, percutáneo, endoscópico percutáneo, por orificio natural o artificial, endoscópico por orificio natural o artificial, por orificio natural o artificial con asistencia endoscópica percutánea y externo."
  },
  {
    "question": "Teoria - Quin és el primer caràcter de la secció mèdica i quirúrgica i quantes seccions indica el qüestionari del temari?",
    "options": [],
    "answer": "0 y 17 secciones",
    "explanation": "El cero identifica la sección Médico-Quirúrgica en el material del IOC."
  },
  {
    "question": "Teoria - Quants valors alfanumèrics té disponibles la CIM-10-SCP per a cada posició abans d’aplicar les restriccions de la taula?",
    "options": [],
    "answer": "34",
    "explanation": "El conjunto se compone de 10 cifras y 24 letras."
  }


  
];


/* ============================
   VARIABLES PRINCIPALES
============================ */
let answeredQuestions = JSON.parse(localStorage.getItem("answeredQuestions")) || [];
let currentQuestion = 0;
let score = 0;
let quizData = [];

const container = document.getElementById("quiz-container");
const resultDiv = document.getElementById("result");
const nextBtn = document.getElementById("nextBtn");
const resetBtn = document.getElementById("resetBtn");

const totalQuestionsText = document.getElementById("totalQuestionsText");
const pendingQuestionsText = document.getElementById("pendingQuestionsText");
const completedQuestionsText = document.getElementById("completedQuestionsText");


/* ============================
   ACTUALIZAR PANEL SUPERIOR
============================ */
function updateProgressPanel() {
  const total = allQuestions.length;
  const completed = answeredQuestions.length;
  const pending = total - completed;

  totalQuestionsText.textContent = `Preguntas totales: ${total}`;
  pendingQuestionsText.textContent = `Preguntas pendientes: ${pending}`;
  completedQuestionsText.textContent = `Preguntas realizadas: ${completed}`;
}


/* ============================
   PREPARAR TEST
============================ */
function prepareQuiz() {
  if (allQuestions.length === 0) {
    container.innerHTML = `
      <div class="question">
        <p>No hay preguntas todavía.</p>
        <p class="small-text">Añade preguntas dentro de la variable allQuestions.</p>
      </div>
    `;
    return;
  }

  // Si ya has hecho todas, se reinicia automáticamente
  if (answeredQuestions.length >= allQuestions.length) {
    answeredQuestions = [];
    localStorage.removeItem("answeredQuestions");

    alert("Has completado todas las preguntas. Se reinicia el ciclo.");
  }

  updateProgressPanel();

  let availableQuestions = allQuestions
    .map((question, index) => index)
    .filter(index => !answeredQuestions.includes(index));

  let numberOfQuestionsToday = parseInt(
    prompt(`¿Cuántas preguntas quieres hacer hoy? Te quedan ${availableQuestions.length} pendientes.`)
  );

  if (
    isNaN(numberOfQuestionsToday) ||
    numberOfQuestionsToday <= 0 ||
    numberOfQuestionsToday > availableQuestions.length
  ) {
    numberOfQuestionsToday = availableQuestions.length;
  }

  shuffle(availableQuestions);

  let selectedIndexes = availableQuestions.slice(0, numberOfQuestionsToday);

  quizData = selectedIndexes.map(index => {
    return {
      ...allQuestions[index],
      originalIndex: index
    };
  });

  showQuestion();
}


/* ============================
   MOSTRAR PREGUNTA
============================ */
function showQuestion() {
  container.innerHTML = "";
  nextBtn.style.display = "none";

  if (currentQuestion >= quizData.length) {
    updateProgressPanel();

    const pending = allQuestions.length - answeredQuestions.length;

    container.innerHTML = `
      <div class="question">
        <p>Quiz terminado</p>
        <p>Tu puntuación final es ${score} de ${quizData.length}</p>
        <p class="small-text">
          Preguntas pendientes para otro día: ${pending}
        </p>
        ${
          pending === 0
          ? `<p class="small-text">Has completado todas las preguntas. La próxima vez se reiniciará el ciclo.</p>`
          : `<p class="small-text">La próxima vez saldrán preguntas que todavía no has hecho.</p>`
        }
      </div>
    `;

    resultDiv.textContent = `Puntuación final: ${score}/${quizData.length}`;
    return;
  }

  const q = quizData[currentQuestion];

  const div = document.createElement("div");
  div.className = "question";

  const p = document.createElement("p");
  p.textContent = `${currentQuestion + 1}. ${q.question}`;
  div.appendChild(p);

  const optionsDiv = document.createElement("div");
  optionsDiv.className = "options";

  const filteredOptions = q.options.filter(opt => opt.trim() !== "");

  // Preguntas cortas: mostramos la solución al pulsar el botón.
  if (filteredOptions.length === 0) {
    const showAnswerBtn = document.createElement("button");
    showAnswerBtn.textContent = "Mostrar respuesta";

    showAnswerBtn.onclick = () => {
      showAnswerBtn.disabled = true;
      showAnswerBtn.textContent = q.answer;
      showAnswerBtn.classList.add("correct");

      const originalIndex = q.originalIndex;
      if (!answeredQuestions.includes(originalIndex)) {
        answeredQuestions.push(originalIndex);
        localStorage.setItem("answeredQuestions", JSON.stringify(answeredQuestions));
      }

      updateProgressPanel();
      nextBtn.style.display = "block";
    };

    optionsDiv.appendChild(showAnswerBtn);
    div.appendChild(optionsDiv);
    container.appendChild(div);
    return;
  }

  // Si quieres que siempre salga V primero y F segundo, comenta la línea siguiente:
  shuffle(filteredOptions);

  filteredOptions.forEach(option => {
    const btn = document.createElement("button");
    btn.textContent = option;
    btn.dataset.correct = option === q.answer ? "true" : "false";

    btn.onclick = () => {
      const allBtns = optionsDiv.querySelectorAll("button");
      allBtns.forEach(b => b.disabled = true);

      // Guardamos esta pregunta como realizada justo al contestarla
      const originalIndex = q.originalIndex;

      if (!answeredQuestions.includes(originalIndex)) {
        answeredQuestions.push(originalIndex);
        localStorage.setItem("answeredQuestions", JSON.stringify(answeredQuestions));
      }

      updateProgressPanel();

      if (btn.dataset.correct === "true") {
        btn.classList.add("correct");
        score++;
      } else {
        btn.classList.add("wrong");

        allBtns.forEach(b => {
          if (b.dataset.correct === "true") {
            b.classList.add("correct");
          }
        });
      }

      resultDiv.textContent = `Puntuación: ${score}/${quizData.length}`;
      nextBtn.style.display = "block";
    };

    optionsDiv.appendChild(btn);
  });

  div.appendChild(optionsDiv);
  container.appendChild(div);
}


/* ============================
   BOTÓN SIGUIENTE
============================ */
nextBtn.onclick = () => {
  currentQuestion++;
  showQuestion();
};


/* ============================
   BOTÓN REINICIAR PROGRESO
============================ */
resetBtn.onclick = () => {
  const confirmReset = confirm("¿Seguro que quieres reiniciar el progreso? Volverán a salir todas las preguntas.");

  if (confirmReset) {
    localStorage.removeItem("answeredQuestions");
    location.reload();
  }
};


/* ============================
   INICIAR QUIZ
============================ */
prepareQuiz();
</script>

</body>
</html>
