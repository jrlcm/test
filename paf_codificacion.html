<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz IPO2</title>

<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background: #f4f4f4;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }

  h1 {
    text-align: center;
    margin: 20px 0 5px 0;
  }

  .subtitle {
    font-size: 16px;
    color: #555;
    margin-bottom: 15px;
    text-align: center;
  }

  .top-panel {
    width: 90%;
    max-width: 600px;
    background: #fff;
    padding: 15px;
    margin-bottom: 10px;
    border-radius: 8px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  }

  .top-panel p {
    margin: 5px 0;
    font-size: 16px;
  }

  .quiz-container {
    width: 90%;
    max-width: 600px;
    margin-bottom: 30px;
    padding-top: 10px;
  }

  .question {
    background: #fff;
    padding: 20px;
    margin: 10px 0;
    border-radius: 8px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  }

  .question p {
    font-size: 34px;
    font-weight: bold;
    line-height: 1.4;
    margin: 0 0 30px 0;
  }

  .options {
    margin-top: 20px;
  }

  .options button {
    display: block;
    margin: 10px 0;
    padding: 15px;
    width: 100%;
    border-radius: 5px;
    border: 1px solid #ccc;
    cursor: pointer;
    background: #eee;
    transition: background 0.3s;
    font-size: 22px;
    text-transform: uppercase;
  }

  .options button:hover {
    background: #ddd;
  }

  .options button:disabled {
    cursor: not-allowed;
  }

  .correct {
    background-color: #c8e6c9 !important;
    border-color: #388e3c !important;
    color: #2e7d32 !important;
  }

  .wrong {
    background-color: #ffcdd2 !important;
    border-color: #d32f2f !important;
    color: #c62828 !important;
  }

  .explanation {
    margin-top: 18px;
    padding: 14px 16px;
    border-radius: 6px;
    border-left: 4px solid #1976D2;
    background: #e8f1fc;
    color: #18334f;
    font-size: 17px;
    line-height: 1.5;
  }

  .result {
    font-weight: bold;
    font-size: 1.3em;
    margin: 10px 0;
  }

  .buttons {
    display: flex;
    gap: 10px;
    margin-bottom: 40px;
    flex-wrap: wrap;
    justify-content: center;
  }

  button.main-btn {
    padding: 12px 25px;
    border: none;
    border-radius: 6px;
    background: #2196F3;
    color: white;
    font-size: 1.1em;
    cursor: pointer;
  }

  button.main-btn:hover {
    background: #1976D2;
  }

  button.reset-btn {
    padding: 12px 25px;
    border: none;
    border-radius: 6px;
    background: #e53935;
    color: white;
    font-size: 1.1em;
    cursor: pointer;
  }

  button.reset-btn:hover {
    background: #c62828;
  }

  .small-text {
    font-size: 15px !important;
    font-weight: normal !important;
    color: #555;
  }

  @media (max-width: 600px) {
    .question p {
      font-size: 28px;
    }

    .options button {
      font-size: 20px;
    }
  }
</style>
</head>

<body>

<h1>Quiz Gestion Administrativa</h1>
<div class="subtitle">Preguntas aleatorias sin repetir hasta completar todo el temario</div>

<div class="top-panel">
  <p id="totalQuestionsText">Preguntas totales: 0</p>
  <p id="pendingQuestionsText">Preguntas pendientes: 0</p>
  <p id="completedQuestionsText">Preguntas realizadas: 0</p>
</div>

<div class="quiz-container" id="quiz-container"></div>

<div class="result" id="result">Puntuación: 0</div>

<div class="buttons">
  <button id="nextBtn" class="main-btn" style="display:none;">Siguiente</button>
  <button id="resetBtn" class="reset-btn">Reiniciar progreso</button>
</div>

<script>
/* ============================
   FUNCIÓN PARA MEZCLAR ARRAYS
============================ */
function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}


/* ============================
   AÑADE AQUÍ TUS PREGUNTAS
   No tienes que indicar cuántas hay.
   El código las cuenta automáticamente.
============================ */
const allQuestions = [

{
   "question": "Una angioplàstia coronària amb stent té com a tipus de procediment arrel inserció.",
    "options": [
      "V",
      "F"
    ],
    "answer": "F",
    "explanation": "L'angioplàstia dilata una artèria: el tipus de procediment és dilatació; l'stent és un dispositiu."
  },
  {
    "question": "Extreure un trombe coronari mitjançant un catèter correspon al tipus de procediment extirpació.",
    "options": [
      "V",
      "F"
    ],
    "answer": "V",
    "explanation": "Eliminar material sòlid d'un vas sense extirpar la paret vascular és extirpació."
  },
  {
    "question": "La col·locació d'un stent modifica el caràcter de dispositiu del codi de dilatació, si la taula ho preveu.",
    "options": [
      "V",
      "F"
    ],
    "answer": "V",
    "explanation": "L'stent es reflecteix en el valor de dispositiu del codi de dilatació, si la taula ho permet."
  },
  {
    "question": "Una duodenoscòpia amb endoscopi introduït per la boca pot tenir un abordatge per orifici natural o artificial endoscòpic.",
    "options": [
      "V",
      "F"
    ],
    "answer": "V",
    "explanation": "La inspecció endoscòpica per via oral utilitza l'abordatge per orifici natural o artificial endoscòpic."
  },
  {
    "question": "Una hèrnia inguinal incarcerada es codifica per defecte com una hèrnia sense obstrucció.",
    "options": [
      "V",
      "F"
    ],
    "answer": "F",
    "explanation": "Una hèrnia incarcerada s'assumeix amb obstrucció en la codificació, llevat d'una indicació contrària específica."
  },
  {
    "question": "En una colecistitis associada a càlculs biliars s'ha de revisar la categoria K80.",
    "options": [
      "V",
      "F"
    ],
    "answer": "V",
    "explanation": "La presència de càlculs amb colecistitis es codifica dins de K80, que recull les dues afeccions."
  },
  {
    "question": "Es pot ometre l'hematèmesi quan és un símptoma integral d'una úlcera hemorràgica diagnosticada.",
    "options": [
      "V",
      "F"
    ],
    "answer": "V",
    "explanation": "L'hematèmesi és la manifestació de l'úlcera amb hemorràgia ja especificada i no cal duplicar-la com a símptoma."
  },
  {
    "question": "Les setmanes completes en el moment de l'ingrés, i no els dies sobrants, determinen habitualment el codi Z3A.",
    "options": [
      "V",
      "F"
    ],
    "answer": "V",
    "explanation": "El codi Z3A s'assigna a partir de les setmanes completes documentades en el moment de l'ingrés."
  },
  {
    "question": "Un part vaginal únic de 36+6 setmanes sense complicacions es pot classificar amb O80.",
    "options": [
      "V",
      "F"
    ],
    "answer": "F",
    "explanation": "A 36+6 setmanes encara és un part prematur, per això no s'ha d'utilitzar O80."
  },
  {
    "question": "Un part vaginal de bessons sans compleix per si mateix tots els requisits per utilitzar O80.",
    "options": [
      "V",
      "F"
    ],
    "answer": "F",
    "explanation": "Un embaràs múltiple no compleix el requisit d'un únic naixement viu que exigeix O80."
  },
  {
    "question": "En la codificació de l'episodi de part de la mare, Z37.0 indica un únic nadó nascut viu.",
    "options": [
      "V",
      "F"
    ],
    "answer": "V",
    "explanation": "Z37.0 és el resultat de part d'un únic nadó viu en el registre de la mare."
  },
  {
    "question": "En un embaràs ectòpic amb resultat abortiu s'ha d'afegir sempre un codi Z3A de setmanes de gestació.",
    "options": [
      "V",
      "F"
    ],
    "answer": "F",
    "explanation": "Els embarassos ectòpics es classifiquen entre els embarassos amb resultat abortiu i no admeten codis Z3A de setmanes."
  }


  
];


/* ============================
   VARIABLES PRINCIPALES
============================ */
let answeredQuestions = JSON.parse(localStorage.getItem("answeredQuestions")) || [];
let currentQuestion = 0;
let score = 0;
let quizData = [];

const container = document.getElementById("quiz-container");
const resultDiv = document.getElementById("result");
const nextBtn = document.getElementById("nextBtn");
const resetBtn = document.getElementById("resetBtn");

const totalQuestionsText = document.getElementById("totalQuestionsText");
const pendingQuestionsText = document.getElementById("pendingQuestionsText");
const completedQuestionsText = document.getElementById("completedQuestionsText");


/* ============================
   ACTUALIZAR PANEL SUPERIOR
============================ */
function updateProgressPanel() {
  const total = allQuestions.length;
  const completed = answeredQuestions.length;
  const pending = total - completed;

  totalQuestionsText.textContent = `Preguntas totales: ${total}`;
  pendingQuestionsText.textContent = `Preguntas pendientes: ${pending}`;
  completedQuestionsText.textContent = `Preguntas realizadas: ${completed}`;
}


/* ============================
   PREPARAR TEST
============================ */
function prepareQuiz() {
  if (allQuestions.length === 0) {
    container.innerHTML = `
      <div class="question">
        <p>No hay preguntas todavía.</p>
        <p class="small-text">Añade preguntas dentro de la variable allQuestions.</p>
      </div>
    `;
    return;
  }

  // Si ya has hecho todas, se reinicia automáticamente
  if (answeredQuestions.length >= allQuestions.length) {
    answeredQuestions = [];
    localStorage.removeItem("answeredQuestions");

    alert("Has completado todas las preguntas. Se reinicia el ciclo.");
  }

  updateProgressPanel();

  let availableQuestions = allQuestions
    .map((question, index) => index)
    .filter(index => !answeredQuestions.includes(index));

  let numberOfQuestionsToday = parseInt(
    prompt(`¿Cuántas preguntas quieres hacer hoy? Te quedan ${availableQuestions.length} pendientes.`)
  );

  if (
    isNaN(numberOfQuestionsToday) ||
    numberOfQuestionsToday <= 0 ||
    numberOfQuestionsToday > availableQuestions.length
  ) {
    numberOfQuestionsToday = availableQuestions.length;
  }

  shuffle(availableQuestions);

  let selectedIndexes = availableQuestions.slice(0, numberOfQuestionsToday);

  quizData = selectedIndexes.map(index => {
    return {
      ...allQuestions[index],
      originalIndex: index
    };
  });

  showQuestion();
}


/* Mostra la justificació només després de respondre */
function showExplanation(question, parent) {
  if (!question.explanation) return;
  const explanationDiv = document.createElement("div");
  explanationDiv.className = "explanation";
  const heading = document.createElement("strong");
  heading.textContent = "Per què? ";
  const explanation = document.createElement("span");
  explanation.textContent = question.explanation;
  explanationDiv.appendChild(heading);
  explanationDiv.appendChild(explanation);
  parent.appendChild(explanationDiv);
}

/* ============================
   MOSTRAR PREGUNTA
============================ */
function showQuestion() {
  container.innerHTML = "";
  nextBtn.style.display = "none";

  if (currentQuestion >= quizData.length) {
    updateProgressPanel();

    const pending = allQuestions.length - answeredQuestions.length;

    container.innerHTML = `
      <div class="question">
        <p>Quiz terminado</p>
        <p>Tu puntuación final es ${score} de ${quizData.length}</p>
        <p class="small-text">
          Preguntas pendientes para otro día: ${pending}
        </p>
        ${
          pending === 0
          ? `<p class="small-text">Has completado todas las preguntas. La próxima vez se reiniciará el ciclo.</p>`
          : `<p class="small-text">La próxima vez saldrán preguntas que todavía no has hecho.</p>`
        }
      </div>
    `;

    resultDiv.textContent = `Puntuación final: ${score}/${quizData.length}`;
    return;
  }

  const q = quizData[currentQuestion];

  const div = document.createElement("div");
  div.className = "question";

  const p = document.createElement("p");
  p.textContent = `${currentQuestion + 1}. ${q.question}`;
  div.appendChild(p);

  const optionsDiv = document.createElement("div");
  optionsDiv.className = "options";

  const filteredOptions = q.options.filter(opt => opt.trim() !== "");

  // Preguntas cortas: mostramos la solución al pulsar el botón.
  if (filteredOptions.length === 0) {
    const showAnswerBtn = document.createElement("button");
    showAnswerBtn.textContent = "Mostrar respuesta";

    showAnswerBtn.onclick = () => {
      showAnswerBtn.disabled = true;
      showAnswerBtn.textContent = q.answer;
      showAnswerBtn.classList.add("correct");

      const originalIndex = q.originalIndex;
      if (!answeredQuestions.includes(originalIndex)) {
        answeredQuestions.push(originalIndex);
        localStorage.setItem("answeredQuestions", JSON.stringify(answeredQuestions));
      }

      updateProgressPanel();
      showExplanation(q, div);
      nextBtn.style.display = "block";
    };

    optionsDiv.appendChild(showAnswerBtn);
    div.appendChild(optionsDiv);
    container.appendChild(div);
    return;
  }

  // Si quieres que siempre salga V primero y F segundo, comenta la línea siguiente:
  shuffle(filteredOptions);

  filteredOptions.forEach(option => {
    const btn = document.createElement("button");
    btn.textContent = option;
    btn.dataset.correct = option === q.answer ? "true" : "false";

    btn.onclick = () => {
      const allBtns = optionsDiv.querySelectorAll("button");
      allBtns.forEach(b => b.disabled = true);

      // Guardamos esta pregunta como realizada justo al contestarla
      const originalIndex = q.originalIndex;

      if (!answeredQuestions.includes(originalIndex)) {
        answeredQuestions.push(originalIndex);
        localStorage.setItem("answeredQuestions", JSON.stringify(answeredQuestions));
      }

      updateProgressPanel();

      if (btn.dataset.correct === "true") {
        btn.classList.add("correct");
        score++;
      } else {
        btn.classList.add("wrong");

        allBtns.forEach(b => {
          if (b.dataset.correct === "true") {
            b.classList.add("correct");
          }
        });
      }

      resultDiv.textContent = `Puntuación: ${score}/${quizData.length}`;
      showExplanation(q, div);
      nextBtn.style.display = "block";
    };

    optionsDiv.appendChild(btn);
  });

  div.appendChild(optionsDiv);
  container.appendChild(div);
}


/* ============================
   BOTÓN SIGUIENTE
============================ */
nextBtn.onclick = () => {
  currentQuestion++;
  showQuestion();
};


/* ============================
   BOTÓN REINICIAR PROGRESO
============================ */
resetBtn.onclick = () => {
  const confirmReset = confirm("¿Seguro que quieres reiniciar el progreso? Volverán a salir todas las preguntas.");

  if (confirmReset) {
    localStorage.removeItem("answeredQuestions");
    location.reload();
  }
};


/* ============================
   INICIAR QUIZ
============================ */
prepareQuiz();
</script>

</body>
</html>
